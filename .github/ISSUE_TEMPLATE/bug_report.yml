name: Bug report
description: Report a reproducible problem with this fork
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include Discord tokens, cookies, passwords, or other credentials.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
      placeholder: 2.48.0-wft.2
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Application
      options:
        - CLI
        - GUI
        - Both
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command/options or GUI steps where possible. Remove all credentials.
      placeholder: |
        1. Export ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Export format
      options:
        - HTML Dark
        - HTML Light
        - Plain Text
        - CSV
        - JSON
        - SQLite
        - Not applicable
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste relevant error/output. Remove tokens, cookies, local private data, and unrelated server content.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
